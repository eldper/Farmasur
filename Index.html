<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmasur – Sucursales y citas</title>
<style>
:root{--bg:#05601F;--bg2:#033d14;--card:#fff;--ink:#05401a;--accent:#7be08f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 18px 40px;text-align:center}
.logo{background:#fff;border-radius:18px;padding:12px 18px;display:inline-block;animation:pop .5s ease-out backwards}
.logo img{display:block;width:210px;max-width:60vw;height:auto}
h1{font-size:25px;margin:20px 0 6px;animation:up .5s .1s ease-out backwards}
p.sub{margin:0 0 18px;opacity:.9;font-size:15px;animation:up .5s .15s ease-out backwards}
.list{display:flex;flex-direction:column;gap:12px}
.list a,.list button{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);color:var(--ink);text-decoration:none;border:0;border-radius:16px;padding:14px 16px;font:700 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .25s,box-shadow .25s;animation:up .4s ease-out backwards;animation-delay:calc(var(--i,0)*45ms + 200ms)}
.list a:hover,.list button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.list a:active,.list button:active{transform:scale(.98)}
.list small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.ic{flex:none;width:56px;height:56px}
img.ic{border-radius:50%;object-fit:cover}
.back{margin:0 auto 16px;display:block;background:transparent;border:2px solid var(--accent);color:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;animation:up .4s ease-out backwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
